<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>LoL Build Calculator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@400;500;600;700&display=swap">
<style>
  :root {
    --rift: #0f2233;      /* page */
    --deep: #0a1824;      /* wells: slots, inputs */
    --panel: #15304a;     /* panel surface */
    --line: #2a4a66;      /* borders */
    --text: #e7e1d2;      /* parchment text */
    --muted: #9fb0bf;
    --gold: #c9a24d;      /* prices, totals */
    --teal: #4fb3ad;      /* focus, interactive */
    --warn: #e58a5a;
    color-scheme: dark;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--rift); color: var(--text);
    font: 16px/1.45 "Barlow Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  }
  header, main, footer { max-width: 1200px; margin: 0 auto; padding: 0 16px; }
  header { display: flex; align-items: baseline; gap: 16px; padding-top: 20px; padding-bottom: 12px; flex-wrap: wrap; }
  h1 { font-size: 28px; font-weight: 700; margin: 0; letter-spacing: .01em; }
  .patch { color: var(--muted); }
  header button { margin-left: auto; }
  button, select, input {
    font: inherit; color: var(--text); background: var(--deep);
    border: 1px solid var(--line); border-radius: 4px; padding: 6px 8px;
  }
  button { cursor: pointer; border-color: var(--teal); color: var(--teal); background: transparent; }
  :focus-visible { outline: 2px solid var(--teal); outline-offset: 2px; }
  select { width: 100%; min-width: 0; }

  #panels { display: grid; gap: 16px; }
  #advisor { margin-top: 16px; }
  .not-scored { margin: 0; padding-left: 1.2em; color: var(--muted); }
  #advisor table.damage td:nth-child(2), #advisor table.damage td:nth-child(3), #advisor table.damage td:nth-child(5) { white-space: nowrap; }
  @media (max-width: 760px) { #advisor table.damage { display: block; overflow-x: auto; } }
  @media (min-width: 1100px) { #panels { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); } }
  .panel {
    background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 16px;
    display: grid; grid-template-columns: minmax(0, 1fr); gap: 20px 28px; align-content: start;
  }
  .full { grid-column: 1 / -1; }
  .combo-list { margin: 0; padding-left: 1.6em; }
  .combo-list li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 3px 0;
    border-bottom: 1px solid var(--line); }
  .combo-list input[type=number] { width: 4em; }
  .combo-buttons { display: flex; gap: 4px; }
  button.icon { padding: 2px 9px; min-width: 32px; }
  .combo-add { margin-top: 8px; flex-wrap: wrap; }
  .combo-add select { flex: 1; min-width: 10em; }
  table.damage td:last-child { text-align: left; }
  .summary { font-size: 19px; font-weight: 600; color: var(--gold); margin: 10px 0 0; }
  .panel h2 { grid-column: 1 / -1; margin: 0; font-size: 22px; font-weight: 600; }
  h3 { font-size: 17px; font-weight: 600; margin: 18px 0 8px; color: var(--muted); }
  h3:first-child { margin-top: 0; }
  label { display: block; color: var(--muted); font-size: 15px; margin: 8px 0 3px; }
  .row { display: flex; gap: 10px; align-items: center; }
  .row input[type=range] { flex: 1; accent-color: var(--teal); padding: 0; border: 0; background: none; }
  .row input[type=number] { width: 4.5em; }
  .check { display: flex; gap: 8px; align-items: center; color: var(--text); margin-top: 12px; }
  .check input { accent-color: var(--teal); width: 18px; height: 18px; }
  .runes-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }

  /* The inventory: six slots in two rows, like the in-game item bar. */
  .inventory { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
  .slot select {
    height: 64px; background: var(--deep); border: 1px solid var(--line); border-radius: 6px;
    white-space: normal; font-weight: 500; padding: 6px;
  }
  .slot select.filled { border-color: var(--gold); }
  .cost { margin-top: 10px; font-size: 20px; font-weight: 600; color: var(--gold); font-variant-numeric: tabular-nums; }
  .notice { margin: 8px 0 0; color: var(--warn); }
  .notice:empty { display: none; }

  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 5px 6px; text-align: right; border-bottom: 1px solid var(--line); }
  th:first-child, td:first-child { text-align: left; }
  th { color: var(--muted); font-weight: 500; }
  td.total { color: var(--gold); font-weight: 600; }
  .note { color: var(--muted); font-size: 14px; margin: 6px 0 0; }

  footer { color: var(--muted); font-size: 13px; padding-top: 24px; padding-bottom: 32px; max-width: 80ch; }

  @media (max-width: 760px) {
    .panel { grid-template-columns: minmax(0, 1fr); }
    h1 { font-size: 24px; }
  }
  @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>
</head>
<body>
<header>
  <h1 data-t="title">LoL Build Calculator</h1>
  <span class="patch"></span>
  <button type="button" id="lang"></button>
</header>
<main>
  <div id="panels"></div>
  <section id="advisor" class="panel" aria-labelledby="advisor-title"></section>
</main>
<footer data-t="disclaimer"></footer>
<script src="data.js"></script>
<script src="engine.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
